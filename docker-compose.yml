services:
  liftassistant:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/${DOCKER_IMAGE:-liftassistant}:latest
    container_name: liftassistant
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      - ./data:/app/data
    environment:
      - LIFT_DEVICE_AUTH_ENABLED=true
      - LLM_PROVIDER=${LLM_PROVIDER:-ollama}
      - LLM_BASE_URL=${LLM_BASE_URL:-http://host.docker.internal:11434}
      - LLM_MODEL=${LLM_MODEL:-ollama/deepseek-r1:14b}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - TZ=${TZ:-America/New_York}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    extra_hosts:
      - "host.docker.internal:host-gateway"
