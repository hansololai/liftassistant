[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "liftassistant"
version = "0.1.0"
description = "AI-powered personal life orchestrator"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }

[project.scripts]
liftassistant = "liftassistant.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["liftassistant*"]
